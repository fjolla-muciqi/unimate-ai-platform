services:
  postgres:
    image: postgres:17
    container_name: unimate_postgres

    environment:
      POSTGRES_USER: unimate
      POSTGRES_PASSWORD: UniMateDB2026!
      POSTGRES_DB: unimate_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unimate -d unimate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: unimate_qdrant

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: